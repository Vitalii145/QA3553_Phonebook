name: UI Tests

on:
  workflow_dispatch:

jobs:
  test-chrome:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: action/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest tests/test_login.py --browser=chrome --headless